<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Light Fingers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0f1a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0f1a; } }
  :root[data-theme="dark"] { --bg: #0d0f1a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #chatbox { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); box-sizing: border-box; display: none;
    font: 12px 'Press Start 2P', monospace; color: #eaffef; background: rgba(10,22,14,0.92); border: 2px solid #5af07a; border-radius: 4px; padding: 10px 12px; outline: none; user-select: text; -webkit-user-select: text; }
  #chatbox::placeholder { color: #6f9a7c; }
  #codewrap { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5,6,14,0.75); }
  #codepanel { width: min(560px, calc(100vw - 32px)); box-sizing: border-box; background: #14121e; border: 2px solid #f7d774; border-radius: 4px; padding: 14px; font: 10px 'Press Start 2P', monospace; color: #f4ecd8; }
  #codetitle { line-height: 1.7; margin-bottom: 10px; }
  #codebox { width: 100%; height: 120px; box-sizing: border-box; background: #0b0a12; color: #cfe8d8; border: 1px solid #5a5070; font: 10px monospace; padding: 6px; resize: none; user-select: text; -webkit-user-select: text; }
  #codepanel button { font: 10px 'Press Start 2P', monospace; margin: 10px 8px 0 0; padding: 8px 10px; background: #2a5a3a; color: #fff; border: 1px solid #7af0a0; border-radius: 3px; cursor: pointer; }
  #codepanel button.alt { background: #3a3446; border-color: #8a80a0; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="vendor/pyric.min.js"></script>
<div id="codewrap"><div id="codepanel"><div id="codetitle"></div><textarea id="codebox" spellcheck="false"></textarea><div><button id="codeok"></button><button id="codecancel" class="alt">Close</button></div></div></div>
<input id="chatbox" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Say something to everyone... (Enter to send, Esc to cancel)">
<script>
'use strict';
// =====================================================================
//  LIGHT FINGERS — a 2D pixel-art village thief game
//  Knock on doors, get invited in, steal when nobody's looking,
//  sell to fences, and outrun the Watch.
// =====================================================================

const FONT = "'Press Start 2P', monospace";
const TS = 16;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
let S = 3, VW = 400, VH = 225, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const W = Math.floor(innerWidth * DPR), H = Math.floor(innerHeight * DPR);
  cv.width = W; cv.height = H;
  S = Math.max(2, Math.round(W > H ? Math.min(W / 420, H / 240) : W / 260));
  VW = Math.ceil(W / S); VH = Math.ceil(H / S);
  lightCv.width = VW; lightCv.height = VH;
}
addEventListener('resize', resize);
resize();

// ---------- tuning ----------
const P_WALK = 50, P_RUN = 84, G_PATROL = 30, G_RUN = 56, G_CHASE = 64;
const STAM_DRAIN = 24, STAM_REGEN = 14, STEAL_BASE = 1.1, HEAT_TIME = 12;
const DAY_LEN = 900; // one full day and night, in seconds (15 minutes)

// ---------- helpers ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function F(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
}
function speck(g, ox, oy, n, cols, seed, tx, ty) {
  for (let i = 0; i < n; i++) {
    const a = hash(tx, ty, seed + i * 3), b = hash(tx, ty, seed + i * 3 + 1), c = hash(tx, ty, seed + i * 3 + 2);
    F(g, ox + Math.floor(a * 16), oy + Math.floor(b * 16), 1, 1, cols[Math.floor(c * cols.length)]);
  }
}
function blob(g, cx, cy, r, col) { g.fillStyle = col; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.5)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function wrap(str, n) {
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > n && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur); return lines;
}
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }
function turnToward(a, b, amt) { const d = angDiff(a, b); return Math.abs(d) <= amt ? b : a + Math.sign(d) * amt; }
function dirFromAngle(a) { const c = Math.cos(a), s = Math.sin(a); return Math.abs(c) > Math.abs(s) ? (c < 0 ? 'left' : 'right') : (s < 0 ? 'up' : 'down'); }
const DIR_ANG = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };

// ---------- audio ----------
let AC = null, master = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(freq, dur, o = {}) {
  if (!AC || muted) return;
  const t = AC.currentTime + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'square'; osc.frequency.setValueAtTime(freq, t);
  if (o.slide) osc.frequency.linearRampToValueAtTime(Math.max(20, freq + o.slide), t + dur);
  g.gain.setValueAtTime(o.vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = buf; g.gain.value = vol;
  src.connect(g); g.connect(master); src.start(AC.currentTime + delay);
}
const SFX = {
  knock() { [0, 0.16, 0.55, 0.71].forEach((d, i) => tone(i % 2 ? 98 : 112, 0.07, { type: 'triangle', vol: 0.35, delay: d })); },
  door() { tone(320, 0.18, { type: 'sawtooth', vol: 0.03, slide: -140 }); },
  steal() { tone(988, 0.06, { vol: 0.05 }); tone(1319, 0.1, { vol: 0.05, delay: 0.06 }); },
  whistle() { tone(2100, 0.12, { type: 'sine', vol: 0.09 }); tone(2500, 0.28, { type: 'sine', vol: 0.09, delay: 0.13, slide: -250 }); },
  alarm() { for (let i = 0; i < 4; i++) tone(650, 0.12, { vol: 0.05, delay: i * 0.17, slide: 350 }); },
  grab() { tone(170, 0.28, { type: 'sawtooth', vol: 0.08, slide: -90 }); },
  struggle() { tone(200 + Math.random() * 90, 0.05, { vol: 0.03 }); },
  free() { tone(523, 0.08, { vol: 0.05 }); tone(784, 0.14, { vol: 0.05, delay: 0.08 }); },
  jail() { noise(0.25, 0.18); tone(70, 0.5, { vol: 0.07, slide: -25 }); },
  coins() { for (let i = 0; i < 6; i++) tone(1100 + i * 140, 0.06, { vol: 0.04, delay: i * 0.05 }); },
  buy() { tone(660, 0.08, { vol: 0.05 }); tone(880, 0.14, { vol: 0.05, delay: 0.08 }); },
  smoke() { noise(0.6, 0.12); },
  rustle() { noise(0.18, 0.06); },
  set() { tone(1250, 0.05, { vol: 0.05 }); tone(1650, 0.06, { vol: 0.04, delay: 0.04 }); },
  snap() { noise(0.08, 0.2); tone(190, 0.12, { type: 'sawtooth', vol: 0.06, slide: -80 }); },
  unlock() { tone(520, 0.08, { vol: 0.05 }); tone(780, 0.1, { vol: 0.05, delay: 0.08 }); tone(1040, 0.14, { vol: 0.05, delay: 0.16 }); },
  bark() { tone(320, 0.07, { type: 'sawtooth', vol: 0.07, slide: -120 }); tone(300, 0.08, { type: 'sawtooth', vol: 0.07, slide: -120, delay: 0.16 }); },
  pick() { tone(2400 + Math.random() * 800, 0.025, { type: 'square', vol: 0.025 }); },
  deny() { tone(140, 0.16, { vol: 0.05 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, { vol: 0.06, delay: i * 0.14 })); },
};

// =====================================================================
//  TILES
// =====================================================================
const T = {
  GRASS: 0, FLOWER: 1, PATH: 2, COBBLE: 3, TREE: 4, ROOF: 5, WALL: 6, WINDOW: 7, DOOR: 8, STONE: 9, JROOF: 10, JDOOR: 11,
  FENCE: 12, BUSH: 13, BARREL: 14, CRATE: 15, LAMP: 16, WELL: 17, STALL: 18, HAY: 19, FIELD: 20, JWIN: 21, GATE: 22, WATER: 23, SEWER: 24, LADDER: 25, MANHOLE: 26, TORCH: 27, RIVER: 28, BRIDGE: 29, BOAT: 55, PLATE: 56, VDOOR: 57, LEVER: 58, VAULT: 59, FENCEV: 60, DOGHOUSE: 61, SACK: 62, PLANTER: 63, SIGNPOST: 64, COACH: 65, HORSE: 66, ROCK: 67, CAVEFLOOR: 68, CAVEMOUTH: 69, CAMPFIRE: 70, STUMP: 71, LOGPILE: 72, SHROOM: 73, WARDROBE: 74, FOUNTAIN: 86, LIGHTHOUSE: 87, OCEAN: 80, DECK: 81, RAIL: 82, MAST: 83, CABWALL: 84, HELM: 85,
  FLOOR: 30, IWALL: 31, IEDGE: 32, EXIT: 34, BED: 35, TABLE: 36, CHAIR: 37, CHEST: 38, SHELF: 39, DRESSER: 40, POT: 41,
  IBARREL: 42, FIRE: 43, PLANT: 44, SFLOOR: 45, SWALL: 46, BARS: 47, CELLDOOR: 48, DESK: 49, BENCH: 50, BED2: 51, SEDGE: 52, STAIRS_UP: 53, STAIRS_DN: 54,
};
const SOLID = new Set([T.TREE, T.ROOF, T.WALL, T.WINDOW, T.DOOR, T.STONE, T.JROOF, T.JDOOR, T.JWIN, T.FENCE, T.BUSH, T.BARREL, T.CRATE,
  T.LAMP, T.WELL, T.STALL, T.HAY, T.IWALL, T.IEDGE, T.BED, T.BED2, T.TABLE, T.CHAIR, T.CHEST, T.SHELF, T.DRESSER, T.POT, T.IBARREL,
  T.FIRE, T.PLANT, T.SWALL, T.SEDGE, T.BARS, T.DESK, T.BENCH, T.WATER, T.TORCH, T.RIVER, T.BOAT, T.LEVER, T.VAULT, T.FENCEV, T.DOGHOUSE, T.SACK, T.PLANTER, T.SIGNPOST, T.COACH, T.HORSE, T.ROCK, T.CAVEMOUTH, T.CAMPFIRE, T.STUMP, T.LOGPILE, T.WARDROBE, T.OCEAN, T.RAIL, T.MAST, T.CABWALL, T.HELM, T.FOUNTAIN, T.LIGHTHOUSE]);
const OPAQUE = new Set([T.ROCK, T.VDOOR, T.TREE, T.ROOF, T.WALL, T.WINDOW, T.DOOR, T.STONE, T.JROOF, T.JDOOR, T.JWIN, T.BUSH, T.STALL, T.HAY,
  T.IWALL, T.IEDGE, T.FIRE, T.SWALL, T.SEDGE, T.SHELF, T.TORCH]);
const LOOT = new Set([T.CHEST, T.SHELF, T.DRESSER, T.POT]);
const PORT_ROOFS = [['#2f7f8f', '#1f5f6c', '#4fa3b3'], ['#3a5f9e', '#2a4677', '#5b7cc0'], ['#e8e4dc', '#bcb6a8', '#ffffff'], ['#2a8a7a', '#1c6a5c', '#4ab09e'], ['#7aa8c8', '#5a88a8', '#a0c8e0']];
const ROOFS = [['#b5473a', '#8e3328', '#cf6a55'], ['#3f5f9e', '#2f4777', '#5b7cc0'], ['#7a5236', '#5c3c26', '#97694a'], ['#4f7f45', '#3b6134', '#6a9c5d'], ['#8a4f8a', '#6a3a6a', '#a96aa9']];

const maps = {};
const houses = [];
const yards = [], yardDogs = [], wallLamps = [], shrooms = [], woodsSpots = [];
const WOODS = { x0: 172, x1: 294, y0: 3, y1: 85 };
const inWoods = () => player.map === 'town' && player.x >= WOODS.x0 * TS && player.x < (WOODS.x1 + 1) * TS && player.y >= WOODS.y0 * TS && player.y < (WOODS.y1 + 1) * TS;
const DOCKS = { gil: { x: 10, y: 93, name: 'Old Gil\'s dock' } };
const DOCK_GOODS = [['Bolt of Silk', 30], ['Crate of Spices', 25], ['Cask of Brandy', 35], ['Tea Chest', 20], ['Ivory Figurine', 55], ['Ship\'s Sextant', 45], ['Crate of Rum', 28], ['Bale of Fine Wool', 22]];
const estates = [], gateTiles = new Map();
const gateAt = (x, y) => gateTiles.get(y * town.w + x);
function newMap(key, w, h, kind) {
  const m = { key, w, h, kind, links: [], tiles: new Uint8Array(w * h), ground: new Uint8Array(w * h), owner: new Int16Array(w * h).fill(-1), loot: new Map(), canvas: null };
  maps[key] = m; return m;
}
function tileAt(m, x, y) { if (x < 0 || y < 0 || x >= m.w || y >= m.h) return -1; return m.tiles[y * m.w + x]; }
let moverIsPlayer = false; // estate gates stop you, but the people who live there have keys
function isSolid(m, x, y) {
  const t = tileAt(m, x, y); if (t < 0) return true;
  if (t === T.GATE) return moverIsPlayer && gateAt(x, y).shut;
  if (t === T.VDOOR) { const L = m.locks && m.locks.get(y * m.w + x); return L ? L.shut && (moverIsPlayer || L.kind === 'lever') : true; } // security doors: staff have keys, but nobody walks through a shut vault gate
  if (t === T.STAIRS_UP && m.guestsOnly && moverIsPlayer && !player.room) return true; // the inn's rooms are for paying guests
  if (t === T.CELLDOOR) return !(m.cellOpen && x === m.cell.x && y === m.cell.y);
  return SOLID.has(t);
}
function isOpaque(m, x, y) { const t = tileAt(m, x, y); return t < 0 || OPAQUE.has(t); }

// ---------- ground painters ----------
const GP = {};
GP[T.GRASS] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#5d9c47'); speck(g, ox, oy, 14, ['#4f8a3c', '#6fb055', '#548f40'], 1, tx, ty);
  if (hash(tx, ty, 9) < 0.35) { const x = ox + 2 + Math.floor(hash(tx, ty, 10) * 11), y = oy + 3 + Math.floor(hash(tx, ty, 11) * 10); F(g, x, y, 1, 2, '#447a34'); F(g, x + 2, y, 1, 2, '#447a34'); F(g, x + 1, y - 1, 1, 3, '#3f7330'); }
};
GP[T.FLOWER] = (g, ox, oy, tx, ty) => {
  GP[T.GRASS](g, ox, oy, tx, ty);
  const cols = ['#f2d14b', '#f07fa8', '#ffffff', '#b48cf2'];
  for (let i = 0; i < 3; i++) {
    const x = ox + 2 + Math.floor(hash(tx, ty, 20 + i) * 12), y = oy + 2 + Math.floor(hash(tx, ty, 30 + i) * 12), c = cols[Math.floor(hash(tx, ty, 40 + i) * 4)];
    F(g, x - 1, y, 3, 1, c); F(g, x, y - 1, 1, 3, c); F(g, x, y, 1, 1, '#f9e79f');
  }
};
const ROADLIKE = new Set([T.PATH, T.COBBLE, T.BRIDGE, T.MANHOLE]);
GP[T.PATH] = (g, ox, oy, tx, ty, m) => {
  F(g, ox, oy, 16, 16, '#b8915f'); speck(g, ox, oy, 18, ['#a47e50', '#c9a46f', '#9a7449'], 2, tx, ty);
  for (let i = 0; i < 2; i++) if (hash(tx, ty, 3 + i) < 0.5) { const px = ox + Math.floor(hash(tx, ty, 4 + i) * 13), py = oy + Math.floor(hash(tx, ty, 5 + i) * 14); F(g, px, py, 2, 2, '#8f8a80'); F(g, px, py, 2, 1, '#a8a296'); }
  if (!m || m.kind !== 'town') return;
  const road = (dx, dy) => { const x = tx + dx, y = ty + dy; return x < 0 || y < 0 || x >= m.w || y >= m.h || ROADLIKE.has(m.ground[y * m.w + x]); };
  const L = road(-1, 0), Rr = road(1, 0), U = road(0, -1), D = road(0, 1);
  if (L && Rr && !(U && D)) { F(g, ox, oy + (U ? 4 : 11), 16, 1, '#a07a4c'); } // wheel ruts along the street
  if (U && D && !(L && Rr)) { F(g, ox + (L ? 4 : 11), oy, 1, 16, '#a07a4c'); }
  const verge = (x, y, w, h) => { F(g, x, y, w, h, '#9d7a4e'); };
  if (!U) { verge(ox, oy, 16, 1); for (let k = 0; k < 16; k += 3) F(g, ox + k, oy, 2, 1 + Math.floor(hash(tx * 5 + k, ty, 70) * 2), '#5d9c47'); }
  if (!D) { verge(ox, oy + 15, 16, 1); for (let k = 1; k < 16; k += 3) F(g, ox + k, oy + 14 + Math.floor(hash(tx * 5 + k, ty, 71) * 2), 2, 2, '#5d9c47'); }
  if (!L) { verge(ox, oy, 1, 16); for (let k = 0; k < 16; k += 3) F(g, ox, oy + k, 1 + Math.floor(hash(tx, ty * 5 + k, 72) * 2), 2, '#5d9c47'); }
  if (!Rr) { verge(ox + 15, oy, 1, 16); for (let k = 1; k < 16; k += 3) F(g, ox + 14 + Math.floor(hash(tx, ty * 5 + k, 73) * 2), oy + k, 2, 2, '#5d9c47'); }
};
GP[T.COBBLE] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#6f6c68');
  g.save(); g.beginPath(); g.rect(ox, oy, 16, 16); g.clip();
  for (let r = 0; r < 4; r++) {
    const y = oy + r * 4, off = (r + ty) % 2 ? 4 : 0;
    for (let k = -1; k < 3; k++) {
      const x = ox + k * 8 + off, h = hash(tx * 4 + k, ty * 4 + r, 6);
      F(g, x, y, 7, 3, h < 0.33 ? '#9a968f' : h < 0.66 ? '#918d86' : '#a39f97'); F(g, x, y, 7, 1, '#b0aca4');
    }
  }
  g.restore();
};
GP[T.FIELD] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#7a5530');
  for (const y of [2, 7, 12]) F(g, ox, oy + y, 16, 1, '#664626');
  for (const y of [4, 9, 14]) for (let x = 1; x < 16; x += 3) { F(g, ox + x, oy + y - 1, 1, 2, '#6aa84f'); F(g, ox + x + 1, oy + y - 2, 1, 1, '#4f8a3c'); }
};
const FLOORS = [['#a46e40', '#7f532e', '#b07a49', '#96613a'], ['#8a5a3a', '#6a4028', '#9a6a46', '#7a4e30'], ['#b8865a', '#94683f', '#c4966a', '#a8784c'], ['#9a7a5a', '#76583c', '#a88a6a', '#8a6a4a']];
GP[T.FLOOR] = (g, ox, oy, tx, ty, m) => {
  const h = m && m.house;
  if (h && ['mansion', 'estate', 'bank'].includes(h.type)) { // polished stone tiles
    const a = (tx + ty) % 2 ? '#c9c2b4' : '#b3aa9a'; F(g, ox, oy, 16, 16, a); F(g, ox, oy, 16, 1, '#e0dacd'); F(g, ox, oy, 1, 16, '#e0dacd'); F(g, ox + 15, oy, 1, 16, '#8a8274'); F(g, ox, oy + 15, 16, 1, '#8a8274');
    speck(g, ox, oy, 3, [shade(a, 0.92), shade(a, 1.06)], 9, tx, ty); return;
  }
  const [b, d, s1, s2] = FLOORS[h ? h.idx % FLOORS.length : 0];
  F(g, ox, oy, 16, 16, b);
  for (let r = 0; r < 4; r++) { const y = oy + r * 4; F(g, ox, y + 3, 16, 1, d); F(g, ox + Math.floor(hash(tx, ty * 4 + r, 8) * 16), y, 1, 3, d); }
  speck(g, ox, oy, 6, [s1, s2], 9, tx, ty);
};
GP[T.SFLOOR] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#6f6a63'); F(g, ox, oy + 7, 16, 1, '#5c5852'); F(g, ox + 7, oy, 1, 16, '#5c5852');
