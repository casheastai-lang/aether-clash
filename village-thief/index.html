<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Light Fingers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0f1a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0f1a; } }
  :root[data-theme="dark"] { --bg: #0d0f1a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  LIGHT FINGERS — a 2D pixel-art village thief game
//  Knock on doors, get invited in, steal when nobody's looking,
//  sell to fences, and outrun the Watch.
// =====================================================================

const FONT = "'Press Start 2P', monospace";
const TS = 16;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
let S = 3, VW = 400, VH = 225, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const W = Math.floor(innerWidth * DPR), H = Math.floor(innerHeight * DPR);
  cv.width = W; cv.height = H;
  S = Math.max(2, Math.round(W > H ? Math.min(W / 420, H / 240) : W / 260));
  VW = Math.ceil(W / S); VH = Math.ceil(H / S);
  lightCv.width = VW; lightCv.height = VH;
}
addEventListener('resize', resize);
resize();

// ---------- tuning ----------
const P_WALK = 50, P_RUN = 84, G_PATROL = 30, G_RUN = 56, G_CHASE = 64;
const STAM_DRAIN = 24, STAM_REGEN = 14, STEAL_TIME = 1.1, HEAT_TIME = 12, GOAL = 1000;
const DAY_LEN = 300;

// ---------- helpers ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function F(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
}
function speck(g, ox, oy, n, cols, seed, tx, ty) {
  for (let i = 0; i < n; i++) {
    const a = hash(tx, ty, seed + i * 3), b = hash(tx, ty, seed + i * 3 + 1), c = hash(tx, ty, seed + i * 3 + 2);
    F(g, ox + Math.floor(a * 16), oy + Math.floor(b * 16), 1, 1, cols[Math.floor(c * cols.length)]);
  }
}
function blob(g, cx, cy, r, col) { g.fillStyle = col; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.5)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function wrap(str, n) {
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > n && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur); return lines;
}
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }
function turnToward(a, b, amt) { const d = angDiff(a, b); return Math.abs(d) <= amt ? b : a + Math.sign(d) * amt; }
function dirFromAngle(a) { const c = Math.cos(a), s = Math.sin(a); return Math.abs(c) > Math.abs(s) ? (c < 0 ? 'left' : 'right') : (s < 0 ? 'up' : 'down'); }
const DIR_ANG = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };

// ---------- audio ----------
let AC = null, master = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(freq, dur, o = {}) {
  if (!AC || muted) return;
  const t = AC.currentTime + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'square'; osc.frequency.setValueAtTime(freq, t);
  if (o.slide) osc.frequency.linearRampToValueAtTime(Math.max(20, freq + o.slide), t + dur);
  g.gain.setValueAtTime(o.vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = buf; g.gain.value = vol;
  src.connect(g); g.connect(master); src.start(AC.currentTime + delay);
}
const SFX = {
  knock() { [0, 0.16, 0.55, 0.71].forEach((d, i) => tone(i % 2 ? 98 : 112, 0.07, { type: 'triangle', vol: 0.35, delay: d })); },
  door() { tone(320, 0.18, { type: 'sawtooth', vol: 0.03, slide: -140 }); },
  steal() { tone(988, 0.06, { vol: 0.05 }); tone(1319, 0.1, { vol: 0.05, delay: 0.06 }); },
  whistle() { tone(2100, 0.12, { type: 'sine', vol: 0.09 }); tone(2500, 0.28, { type: 'sine', vol: 0.09, delay: 0.13, slide: -250 }); },
  alarm() { for (let i = 0; i < 4; i++) tone(650, 0.12, { vol: 0.05, delay: i * 0.17, slide: 350 }); },
  grab() { tone(170, 0.28, { type: 'sawtooth', vol: 0.08, slide: -90 }); },
  struggle() { tone(200 + Math.random() * 90, 0.05, { vol: 0.03 }); },
  free() { tone(523, 0.08, { vol: 0.05 }); tone(784, 0.14, { vol: 0.05, delay: 0.08 }); },
  jail() { noise(0.25, 0.18); tone(70, 0.5, { vol: 0.07, slide: -25 }); },
  coins() { for (let i = 0; i < 6; i++) tone(1100 + i * 140, 0.06, { vol: 0.04, delay: i * 0.05 }); },
  buy() { tone(660, 0.08, { vol: 0.05 }); tone(880, 0.14, { vol: 0.05, delay: 0.08 }); },
  smoke() { noise(0.6, 0.12); },
  rustle() { noise(0.18, 0.06); },
  set() { tone(1250, 0.05, { vol: 0.05 }); tone(1650, 0.06, { vol: 0.04, delay: 0.04 }); },
  snap() { noise(0.08, 0.2); tone(190, 0.12, { type: 'sawtooth', vol: 0.06, slide: -80 }); },
  unlock() { tone(520, 0.08, { vol: 0.05 }); tone(780, 0.1, { vol: 0.05, delay: 0.08 }); tone(1040, 0.14, { vol: 0.05, delay: 0.16 }); },
  bark() { tone(320, 0.07, { type: 'sawtooth', vol: 0.07, slide: -120 }); tone(300, 0.08, { type: 'sawtooth', vol: 0.07, slide: -120, delay: 0.16 }); },
  pick() { tone(2400 + Math.random() * 800, 0.025, { type: 'square', vol: 0.025 }); },
  deny() { tone(140, 0.16, { vol: 0.05 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, { vol: 0.06, delay: i * 0.14 })); },
};

// =====================================================================
//  TILES
// =====================================================================
const T = {
  GRASS: 0, FLOWER: 1, PATH: 2, COBBLE: 3, TREE: 4, ROOF: 5, WALL: 6, WINDOW: 7, DOOR: 8, STONE: 9, JROOF: 10, JDOOR: 11,
  FENCE: 12, BUSH: 13, BARREL: 14, CRATE: 15, LAMP: 16, WELL: 17, STALL: 18, HAY: 19, FIELD: 20, JWIN: 21,
  FLOOR: 30, IWALL: 31, IEDGE: 32, EXIT: 34, BED: 35, TABLE: 36, CHAIR: 37, CHEST: 38, SHELF: 39, DRESSER: 40, POT: 41,
  IBARREL: 42, FIRE: 43, PLANT: 44, SFLOOR: 45, SWALL: 46, BARS: 47, CELLDOOR: 48, DESK: 49, BENCH: 50, BED2: 51, SEDGE: 52, STAIRS_UP: 53, STAIRS_DN: 54,
};
const SOLID = new Set([T.TREE, T.ROOF, T.WALL, T.WINDOW, T.DOOR, T.STONE, T.JROOF, T.JDOOR, T.JWIN, T.FENCE, T.BUSH, T.BARREL, T.CRATE,
  T.LAMP, T.WELL, T.STALL, T.HAY, T.IWALL, T.IEDGE, T.BED, T.BED2, T.TABLE, T.CHAIR, T.CHEST, T.SHELF, T.DRESSER, T.POT, T.IBARREL,
  T.FIRE, T.PLANT, T.SWALL, T.SEDGE, T.BARS, T.DESK, T.BENCH]);
const OPAQUE = new Set([T.TREE, T.ROOF, T.WALL, T.WINDOW, T.DOOR, T.STONE, T.JROOF, T.JDOOR, T.JWIN, T.BUSH, T.STALL, T.HAY,
  T.IWALL, T.IEDGE, T.FIRE, T.SWALL, T.SEDGE, T.SHELF]);
const LOOT = new Set([T.CHEST, T.SHELF, T.DRESSER, T.POT]);
const ROOFS = [['#b5473a', '#8e3328', '#cf6a55'], ['#3f5f9e', '#2f4777', '#5b7cc0'], ['#7a5236', '#5c3c26', '#97694a'], ['#4f7f45', '#3b6134', '#6a9c5d'], ['#8a4f8a', '#6a3a6a', '#a96aa9']];

const maps = {};
const houses = [];
function newMap(key, w, h, kind) {
  const m = { key, w, h, kind, links: [], tiles: new Uint8Array(w * h), ground: new Uint8Array(w * h), owner: new Int16Array(w * h).fill(-1), loot: new Map(), canvas: null };
  maps[key] = m; return m;
}
function tileAt(m, x, y) { if (x < 0 || y < 0 || x >= m.w || y >= m.h) return -1; return m.tiles[y * m.w + x]; }
function isSolid(m, x, y) {
  const t = tileAt(m, x, y); if (t < 0) return true;
  if (t === T.CELLDOOR) return !(m.cellOpen && x === m.cell.x);
  return SOLID.has(t);
}
function isOpaque(m, x, y) { const t = tileAt(m, x, y); return t < 0 || OPAQUE.has(t); }

// ---------- ground painters ----------
const GP = {};
GP[T.GRASS] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#5d9c47'); speck(g, ox, oy, 14, ['#4f8a3c', '#6fb055', '#548f40'], 1, tx, ty);
  if (hash(tx, ty, 9) < 0.35) { const x = ox + 2 + Math.floor(hash(tx, ty, 10) * 11), y = oy + 3 + Math.floor(hash(tx, ty, 11) * 10); F(g, x, y, 1, 2, '#447a34'); F(g, x + 2, y, 1, 2, '#447a34'); F(g, x + 1, y - 1, 1, 3, '#3f7330'); }
};
GP[T.FLOWER] = (g, ox, oy, tx, ty) => {
  GP[T.GRASS](g, ox, oy, tx, ty);
  const cols = ['#f2d14b', '#f07fa8', '#ffffff', '#b48cf2'];
  for (let i = 0; i < 3; i++) {
    const x = ox + 2 + Math.floor(hash(tx, ty, 20 + i) * 12), y = oy + 2 + Math.floor(hash(tx, ty, 30 + i) * 12), c = cols[Math.floor(hash(tx, ty, 40 + i) * 4)];
    F(g, x - 1, y, 3, 1, c); F(g, x, y - 1, 1, 3, c); F(g, x, y, 1, 1, '#f9e79f');
  }
};
GP[T.PATH] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#b8915f'); speck(g, ox, oy, 18, ['#a47e50', '#c9a46f', '#9a7449'], 2, tx, ty);
  if (hash(tx, ty, 3) < 0.5) F(g, ox + Math.floor(hash(tx, ty, 4) * 13), oy + Math.floor(hash(tx, ty, 5) * 14), 2, 1, '#8f8a80');
};
GP[T.COBBLE] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#6f6c68');
  g.save(); g.beginPath(); g.rect(ox, oy, 16, 16); g.clip();
  for (let r = 0; r < 4; r++) {
    const y = oy + r * 4, off = (r + ty) % 2 ? 4 : 0;
    for (let k = -1; k < 3; k++) {
      const x = ox + k * 8 + off, h = hash(tx * 4 + k, ty * 4 + r, 6);
      F(g, x, y, 7, 3, h < 0.33 ? '#9a968f' : h < 0.66 ? '#918d86' : '#a39f97'); F(g, x, y, 7, 1, '#b0aca4');
    }
  }
  g.restore();
};
GP[T.FIELD] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#7a5530');
  for (const y of [2, 7, 12]) F(g, ox, oy + y, 16, 1, '#664626');
  for (const y of [4, 9, 14]) for (let x = 1; x < 16; x += 3) { F(g, ox + x, oy + y - 1, 1, 2, '#6aa84f'); F(g, ox + x + 1, oy + y - 2, 1, 1, '#4f8a3c'); }
};
GP[T.FLOOR] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#a46e40');
  for (let r = 0; r < 4; r++) { const y = oy + r * 4; F(g, ox, y + 3, 16, 1, '#7f532e'); F(g, ox + Math.floor(hash(tx, ty * 4 + r, 8) * 16), y, 1, 3, '#7f532e'); }
  speck(g, ox, oy, 6, ['#b07a49', '#96613a'], 9, tx, ty);
};
GP[T.SFLOOR] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#6f6a63'); F(g, ox, oy + 7, 16, 1, '#5c5852'); F(g, ox + 7, oy, 1, 16, '#5c5852');
  F(g, ox, oy + 15, 16, 1, '#5c5852'); F(g, ox + 15, oy, 1, 16, '#5c5852'); speck(g, ox, oy, 8, ['#7a756d', '#625e58'], 11, tx, ty);
};

// ---------- object painters ----------
const OP = {};
OP[T.TREE] = (g, ox, oy) => {
  F(g, ox + 3, oy + 14, 10, 2, 'rgba(0,0,0,0.25)'); F(g, ox + 6, oy + 10, 4, 6, '#6b4423'); F(g, ox + 6, oy + 10, 1, 6, '#5a381c');
  blob(g, ox + 8, oy + 7, 7, '#2f6b2f'); blob(g, ox + 7, oy + 6, 5, '#3f8a3a'); blob(g, ox + 6, oy + 4, 2, '#5aa64c');
  F(g, ox + 10, oy + 8, 1, 1, '#5aa64c'); F(g, ox + 4, oy + 9, 1, 1, '#2a5a29');
};
function houseOf(m, tx, ty) { return houses[m.owner[ty * m.w + tx]]; }
OP[T.ROOF] = (g, ox, oy, tx, ty, m) => {
  const h = houseOf(m, tx, ty), [c, d, l] = ROOFS[h.roof], row = ty - h.y;
  F(g, ox, oy, 16, 16, c);
  for (let k = 0; k < 4; k++) { const y = oy + k * 4; F(g, ox, y + 3, 16, 1, d); const off = ((k + row) % 2) * 4; for (let x = off; x < 16; x += 8) { F(g, ox + x, y, 1, 3, d); F(g, ox + x + 1, y, 3, 1, l); } }
  if (row === 0) { F(g, ox, oy, 16, 2, d); F(g, ox, oy + 2, 16, 1, l); if (tx === h.x + h.w - 2) { F(g, ox + 5, oy - 0, 6, 9, '#7a706a'); F(g, ox + 4, oy, 8, 2, '#5a524c'); F(g, ox + 6, oy + 3, 1, 5, '#8e857e'); } }
  if (row === h.roofRows - 1) { F(g, ox, oy + 13, 16, 2, d); F(g, ox, oy + 15, 16, 1, '#2a1d14'); }
  if (tx === h.x) { F(g, ox, oy, 1, 16, '#2a1d14'); F(g, ox + 1, oy, 1, 16, d); }
  if (tx === h.x + h.w - 1) { F(g, ox + 15, oy, 1, 16, '#2a1d14'); F(g, ox + 14, oy, 1, 16, d); }
};
OP[T.WALL] = (g, ox, oy, tx, ty, m) => {
  const h = houseOf(m, tx, ty), row = ty - h.y, beam = '#6b4a2b';
  F(g, ox, oy, 16, 16, '#e8d7ae'); speck(g, ox, oy, 8, ['#d9c595', '#f1e3c0'], 7, tx, ty);
  if (row === h.roofRows) { F(g, ox, oy, 16, 2, beam); F(g, ox, oy + 15, 16, 1, beam); }
  if (row > h.roofRows && row < h.h - 1) F(g, ox, oy + 15, 16, 1, beam);
  if (row === h.h - 1) { F(g, ox, oy + 13, 16, 3, '#8e877c'); F(g, ox, oy + 13, 16, 1, '#6f695f'); F(g, ox + 5, oy + 14, 1, 2, '#6f695f'); F(g, ox + 11, oy + 14, 1, 2, '#6f695f'); }
  if (tx === h.x) F(g, ox, oy, 2, 16, beam);
  if (tx === h.x + h.w - 1) F(g, ox + 14, oy, 2, 16, beam);
  if (row === h.roofRows && m.tiles[ty * m.w + tx] === T.WALL && (tx - h.x) % 2 === 0 && tx !== h.x && tx !== h.x + h.w - 1) for (let i = 0; i < 12; i++) F(g, ox + 2 + i, oy + 2 + i, 2, 1, beam);
};
OP[T.WINDOW] = (g, ox, oy, tx, ty, m) => {
  OP[T.WALL](g, ox, oy, tx, ty, m);
  F(g, ox + 3, oy + 2, 10, 10, '#5a3b22'); F(g, ox + 4, oy + 3, 8, 8, '#8ec5d9');
  F(g, ox + 7, oy + 3, 1, 8, '#5a3b22'); F(g, ox + 4, oy + 7, 8, 1, '#5a3b22'); F(g, ox + 5, oy + 4, 1, 2, '#d5f0f7');
  F(g, ox + 3, oy + 12, 10, 2, '#7a4b24'); F(g, ox + 4, oy + 11, 1, 1, '#f07fa8'); F(g, ox + 7, oy + 11, 1, 1, '#f2d14b'); F(g, ox + 10, oy + 11, 1, 1, '#f07fa8');
};
OP[T.DOOR] = (g, ox, oy, tx, ty, m) => {
  OP[T.WALL](g, ox, oy, tx, ty, m);
  F(g, ox + 3, oy + 3, 10, 13, '#4a2e17'); F(g, ox + 5, oy + 2, 6, 1, '#4a2e17');
  F(g, ox + 4, oy + 4, 8, 12, '#8a5a2b'); F(g, ox + 6, oy + 4, 1, 12, '#6e451f'); F(g, ox + 9, oy + 4, 1, 12, '#6e451f');
  F(g, ox + 4, oy + 7, 8, 1, '#6e451f'); F(g, ox + 10, oy + 10, 1, 1, '#e8c45a'); F(g, ox + 2, oy + 15, 12, 1, '#9c968c');
};
function stoneTile(g, ox, oy, tx, ty) {
  F(g, ox, oy, 16, 16, '#7f818a');
  for (let r = 0; r < 4; r++) { const y = oy + r * 4; F(g, ox, y + 3, 16, 1, '#62646c'); const off = (r + ty) % 2 ? 4 : 0; for (let x = off; x < 16; x += 8) F(g, ox + x, y, 1, 3, '#62646c'); F(g, ox, y, 16, 1, '#8e9099'); }
  speck(g, ox, oy, 5, ['#6f717a', '#93959e'], 12, tx, ty);
}
OP[T.STONE] = (g, ox, oy, tx, ty) => stoneTile(g, ox, oy, tx, ty);
OP[T.JWIN] = (g, ox, oy, tx, ty) => { stoneTile(g, ox, oy, tx, ty); F(g, ox + 4, oy + 3, 8, 8, '#1b1c22'); for (let x = 5; x < 12; x += 2) F(g, ox + x, oy + 3, 1, 8, '#9a9ca6'); F(g, ox + 3, oy + 11, 10, 1, '#55575f'); };
OP[T.JROOF] = (g, ox, oy, tx, ty) => {
  F(g, ox, oy, 16, 16, '#4b5068');
  for (let k = 0; k < 4; k++) { const y = oy + k * 4; F(g, ox, y + 3, 16, 1, '#383c50'); const off = (k % 2) * 4; for (let x = off; x < 16; x += 8) { F(g, ox + x, y, 1, 3, '#383c50'); F(g, ox + x + 1, y, 3, 1, '#63698a'); } }
  const m = maps.town, j = m.jail;
  if (ty === j.y) { F(g, ox, oy, 16, 2, '#2c2f3e'); }
  if (ty === j.y + 2) { F(g, ox, oy + 13, 16, 3, '#2c2f3e'); }
  if (tx === j.x) F(g, ox, oy, 1, 16, '#1d1f2a'); if (tx === j.x + j.w - 1) F(g, ox + 15, oy, 1, 16, '#1d1f2a');
};
OP[T.JDOOR] = (g, ox, oy, tx, ty) => {
  stoneTile(g, ox, oy, tx, ty);
  F(g, ox + 3, oy + 2, 10, 14, '#2a2a30'); F(g, ox + 4, oy + 3, 8, 13, '#3a3a42');

function renderMap(m) {
  const c = mk(m.w * TS, m.h * TS), g = c.getContext('2d');
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) { const gr = m.ground[y * m.w + x]; (GP[gr] || GP[T.GRASS])(g, x * TS, y * TS, x, y, m); }
  if (m.rug) {
    const r = m.rug, x = r.x * TS + 3, y = r.y * TS + 3, w = r.w * TS - 6, h = r.h * TS - 6;
    F(g, x, y, w, h, r.c2); F(g, x + 2, y + 2, w - 4, h - 4, r.c); F(g, x + 4, y + 4, w - 8, h - 8, r.c2); F(g, x + 5, y + 5, w - 10, h - 10, r.c);
    for (let i = 8; i < w - 8; i += 6) { F(g, x + i, y + h / 2 - 1, 2, 2, r.c2); }
  }
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) { const t = m.tiles[y * m.w + x]; if (OP[t]) OP[t](g, x * TS, y * TS, x, y, m); }
  if (m.kind === 'town') { // Watch House shield above the jail door
    const d = m.jail.door, ox = d.x * TS, oy = (d.y - 1) * TS;

  m.canvas = c;
}

function drawChar(sp, dir, f) {
  const c = mk(16, 22), g = c.getContext('2d'); const C = !!sp.child, ox = 2, oy = C ? 8 : 6;
  const LY = C ? 11 : 12, LL = C ? 2 : 3, SY = LY + LL, BH = C ? 4 : 5, AL = C ? 3 : 4;
  const r = (x, y, w, h, col) => { if (!col) return; g.fillStyle = col; g.fillRect(ox + x, oy + y, w, h); };
  const sd = shade(sp.shirt, -0.28), pd = shade(sp.pants, -0.25), sk = sp.skin, skd = shade(sk, -0.18), shoes = sp.shoes || '#2a1d14';
  const hair = sp.hair, hc = sp.hatC, spearC = '#7a5a3a', tip = '#d6dae2', eye = '#1b1b1b';
  if (sp.spear && dir === 'up') { r(-1, -3, 1, 18, spearC); r(-2, -4, 3, 1, tip); r(-1, -5, 1, 1, tip); }
  if (dir === 'down' || dir === 'up') {
    const l1 = f === 1 ? 1 : 0, l2 = f === 2 ? 1 : 0;
    if (sp.dress) { if (C) { r(2, 10, 8, 2, sp.pants); r(2, 11, 8, 1, pd); r(3, 12, 2, 1, skd); r(7, 12, 2, 1, skd); } else { r(2, 11, 8, 3, sp.pants); r(2, 13, 8, 1, pd); r(3, 14, 2, 1, skd); r(7, 14, 2, 1, skd); } r(3, SY - l1, 2, 1, shoes); r(7, SY - l2, 2, 1, shoes); }
    else { r(3, LY, 2, LL - l1, sp.pants); r(3, SY - l1, 2, 1, shoes); r(7, LY, 2, LL - l2, sp.pants); r(7, SY - l2, 2, 1, shoes); }
    r(2, 7, 8, BH, sp.shirt); r(2, 6 + BH, 8, 1, sp.belt || sd);
    if (dir === 'down' && sp.apron) r(3, 8, 6, 5, sp.apron);
    if (dir === 'down' && sp.emblem) { r(5, 8, 2, 2, sp.emblem); }
    if (dir === 'up' && sp.sack) { r(3, 7, 6, 5, '#9c7a4a'); r(4, 6, 4, 1, '#7a5a34'); r(5, 8, 1, 3, '#b8955f'); }
    const a = f === 1 ? 1 : 0, b = f === 2 ? 1 : 0;
    r(1, 7 + a, 1, AL, sd); r(1, 7 + AL + a, 1, 1, sk); r(10, 7 + b, 1, AL, sd); r(10, 7 + AL + b, 1, 1, sk);
    r(2, 1, 8, 6, sk); r(2, 6, 8, 1, skd);
    if (dir === 'down') {
      r(3, 4, 1, 1, eye); r(8, 4, 1, 1, eye);
      if (sp.beard) r(3, 5, 6, 2, hair);
      if (sp.mask) r(2, 5, 8, 2, sp.mask);
      if (sp.patch) { r(7, 3, 2, 2, '#111'); r(2, 2, 8, 1, '#111'); }
      if (sp.rosy) { r(3, 5, 1, 1, '#e8908a'); r(8, 5, 1, 1, '#e8908a'); }
      const st = sp.hairStyle;
      if (st === 'short' || st === 'bun' || st === 'long') { r(2, 0, 8, 2, hair); r(2, 2, 1, 2, hair); r(9, 2, 1, 2, hair); }
      if (st === 'long') { r(1, 2, 1, 7, hair); r(10, 2, 1, 7, hair); r(2, 2, 1, 4, hair); r(9, 2, 1, 4, hair); }
      if (st === 'bun') r(4, -2, 4, 2, hair);
      if (st === 'bald') { r(2, 1, 8, 1, skd); r(2, 2, 1, 2, hair); r(9, 2, 1, 2, hair); }
    } else {
      const st = sp.hairStyle;
      if (st === 'bald') { r(2, 1, 8, 2, skd); r(2, 3, 8, 3, hair); }
      else r(2, 0, 8, 6, hair);
      if (st === 'long') r(1, 2, 10, 7, hair);
      if (st === 'bun') r(4, -2, 4, 2, hair);
    }
    if (sp.hat === 'hood') {
      if (dir === 'down') { r(1, -1, 10, 3, hc); r(1, 2, 2, 5, hc); r(9, 2, 2, 5, hc); r(3, 2, 6, 1, shade(hc, -0.35)); r(1, 7, 10, 2, hc); }
      else { r(1, -1, 10, 8, hc); r(1, 7, 10, 3, hc); r(4, 0, 4, 1, shade(hc, 0.15)); }
    } else if (sp.hat === 'helmet') {
      r(2, -1, 8, 3, '#b9bec8'); r(1, 2, 10, 1, '#7f8590'); r(3, -1, 2, 1, '#e1e5ec'); r(5, -3, 2, 2, '#c0392b');
      if (dir === 'down') r(5, 2, 2, 2, '#7f8590');
    } else if (sp.hat === 'cap') {
      r(2, -1, 8, 3, hc); if (dir === 'down') r(1, 2, 10, 1, shade(hc, -0.3));
    } else if (sp.hat === 'kerchief') {
      r(2, -1, 8, 3, hc); r(1, 1, 1, 2, hc); r(10, 1, 1, 2, hc); if (dir === 'up') { r(2, 2, 8, 2, hc); r(5, 4, 2, 2, hc); }
    }
    if (sp.spear && dir === 'down') { r(11, -3, 1, 18, spearC); r(10, -4, 3, 1, tip); r(11, -5, 1, 1, tip); r(10, 9, 2, 1, sk); }

  if (hit('m')) { muted = !muted; msg(muted ? 'Sound off' : 'Sound on', '#aaa'); }
  if (state === 'title') {
    gameTime += dt; for (const g of guards) updateGuard(g, dt);
    updateCamera(dt, 'town', 48 * TS + Math.sin(now / 9000) * 560, 34 * TS + Math.cos(now / 11000) * 360);
    if (hit('enter') || hit(' ') || hit('e')) startGame();
  } else if (state === 'menu') {
    if (hit('1')) sellAll(); if (hit('2')) buy('sack', 120); if (hit('3')) buy('boots', 150); if (hit('4')) buy('tongue', 130); if (hit('5')) buy('smoke', 50); if (hit('6')) buy('lockpicks', 20); if (hit('7')) buy('picks', 100);
    if (hit('escape') || hit('e')) closeMenu();
    for (const f of fences) if (f.bubble) { f.bubble.t -= dt; if (f.bubble.t <= 0) f.bubble = null; }
    for (const mm of msgs) mm.t -= dt * 0.3;
  } else {
    if (hit('p') || (hit('escape') && player.state !== 'picking')) paused = !paused;
    if (!paused) updateWorld(dt);
    updateCamera(paused ? 0 : dt, player.map, player.state === 'hidden' ? player.hay.x * TS + 8 : player.x, player.y - 8);
  }
  render(dt);
  pressed.clear();
  requestAnimationFrame(frame);
}
updateCamera(null, 'town', 48 * TS, 34 * TS);
requestAnimationFrame(frame);

  sim(sec) { for (let i = 0; i < sec * 60; i++) { updateWorld(1 / 60); pressed.clear(); } updateCamera(null, player.map, player.x, player.y - 8); } };
